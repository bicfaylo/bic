<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a href="#top" class="logo" id="logo"></a>
    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <img id="avatar" class="avatar" alt="Profile photo">
      <h1 id="name"></h1>
      <p id="tagline" class="tagline"></p>
      <a href="#work" class="btn">See my work</a>
    </section>

    <section id="work" class="section">
      <h2>My Work</h2>
      <div id="filters" class="filters"></div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="about" class="section about">
      <h2>About Me</h2>
      <p id="about-text"></p>
      <ul id="skills" class="skills"></ul>
    </section>

    <section id="contact" class="section contact">
      <h2>Get in touch</h2>
      <p>Have a project in mind? Let's talk.</p>
      <div id="links" class="links"></div>
    </section>
  </main>

  <footer class="footer"><span id="year"></span> · <span id="footer-name"></span></footer>

  <div id="lightbox" class="lightbox" hidden>
    <button class="close" aria-label="Close">&times;</button>
    <img alt="">
    <p class="caption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
